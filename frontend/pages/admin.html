<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة المستخدمين | General System</title><link rel="stylesheet" href="../assets/css/main.css"><style>body{background:#101827;color:#eef2ff;font-family:system-ui;margin:0}main{max-width:1100px;margin:auto;padding:32px 20px}header{display:flex;justify-content:space-between;align-items:center;gap:16px}a{color:#8bd5ff}.panel{background:#1c273a;border:1px solid #35435b;border-radius:16px;padding:24px;margin:24px 0}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}label{display:grid;gap:8px}input,button{font:inherit;padding:12px;border-radius:8px;border:1px solid #63718a}input{background:#101827;color:white}button{cursor:pointer;background:#77d0b8;color:#101827}button:disabled{opacity:.5}table{width:100%;border-collapse:collapse}td,th{padding:16px 8px;text-align:right;border-bottom:1px solid #35435b}td button{margin:4px}footer{text-align:center;color:#aab8cd;padding:24px}.table-wrap{overflow:auto}#message{white-space:pre-wrap}h1{font-size:28px}</style></head>
<body><main><header><div><h1>إدارة حسابات المستخدمين</h1><p>حساب مستقل ومساحة بيانات خاصة لكل مستخدم</p></div><a href="./dashboard.html">العودة للنظام</a></header>
<p id="message" role="status" aria-live="polite"></p><section class="panel"><h2>إضافة مستخدم</h2><form id="createUser"><label>الاسم<input name="displayName" required maxlength="120" autocomplete="name"></label><label>اسم المستخدم<input name="username" required pattern="[a-zA-Z0-9_.-]{3,64}" dir="ltr" autocomplete="off" title="3 إلى 64 حرف إنجليزي أو رقم أو نقطة أو شرطة"></label><label>كلمة المرور (12 حرفًا على الأقل)<input name="password" type="password" required minlength="12" maxlength="256" autocomplete="new-password"></label><button type="submit">إنشاء الحساب</button></form></section>
<section class="panel"><h2>المستخدمون</h2><p id="count"></p><div class="table-wrap"><table><thead><tr><th>الاسم</th><th>اسم المستخدم</th><th>الصلاحية</th><th>الحالة</th><th>الإجراءات</th></tr></thead><tbody id="users"></tbody></table></div></section>
<dialog id="passwordDialog"><form id="resetPassword"><h2>إعادة تعيين كلمة المرور</h2><label>كلمة المرور الجديدة<input name="password" type="password" required minlength="12" maxlength="256" autocomplete="new-password"></label><p>سيتم إنهاء الجلسات الحالية لهذا المستخدم.</p><button type="submit">حفظ</button><button type="button" id="cancelPassword">إلغاء</button></form></dialog>
<footer>Developed by Daidar</footer></main><script type="module" src="../assets/js/pages/admin.js"></script></body></html>
